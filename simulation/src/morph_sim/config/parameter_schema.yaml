  terramechanics:
    implemented_in: src/terramechanics_system.cpp, morph_sim/terramechanics.py
    scope: Force-level emulation over rigid contact; soil constants come from surfaces.<name>.bekker; no geometric deformation
    sinkage_limit_radius_fraction:
      default: 0.5
      units: '1'
      status: assumed
      uncertainty: null
      source: Model bound - the rigid-wheel sinkage formula is not used beyond half the wheel radius
    reload_resistance_fraction:
      default: 0.1
      units: '1'
      status: assumed
      uncertainty: null
      source: Assumed hysteresis loss when a wheel reloads soil already compacted by a leading wheel (Wong repetitive loading); not measured
    slip_sinkage_gain:
      default: 0.0
      units: '1'
      status: assumed
      uncertainty: null
      source: Scale on the Lyasko slip-sinkage ratio (1+s)/(1-0.5 s). 0 (default) reports slip without slip sinkage - with gain 1 the coupled solution runs to the slip limit for the leading wheels on every soil in this table (uncalibrated wheel-soil pair)
    slip_drag_enabled:
      default: 0.0
      units: '1'
      status: assumed
      uncertainty: null
      source: 1 applies the slip power-loss equivalent resistance T s/(1-s); 0 (default) reports soil slip without charging it as torque
    slip_ratio_limit:
      default: 0.9
      units: '1'
      status: assumed
      uncertainty: null
      source: Upper bound on the Janosi-Hanamoto slip estimate
    speed_scale_rad_s:
